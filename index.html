<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPARA - Link Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Elemen Dekorasi Background Geometris -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <div class="container">
    
    <!-- Profile Section -->
    <div class="profile-section">
      
      <!-- Banner Header Belakang Profil -->
      <div class="banner-wrapper">
        <picture>
          <source srcset="banner.webp" type="image/webp">
          <img src="banner.png" alt="Banner Header" class="banner-img" onerror="this.onerror=null; this.src='banner.jpg';">
        </picture>
      </div>

      <!-- Avatar Foto Profil Bulat -->
      <div class="avatar-wrapper">
        <picture>
          <source srcset="profile.webp" type="image/webp">
          <img src="profile.png" alt="PAPARA Profile" class="avatar-img" onerror="this.onerror=null; this.src='profile.png';">
        </picture>
      </div>

      <h1 class="profile-title">PAPARA</h1>
      <p class="profile-subtitle">Official Contact & Social Media</p>
    </div>

    <!-- Links Container -->
    <div class="links-container">
      
      <!-- Instagram -->

                  <stop offset="75%" stop-color="#cc2366"/>
                  <stop offset="100%" stop-color="#bc1888"/>

              </defs>

        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@glenzi20" target="_blank" rel="noopener noreferrer" class="neu-btn btn-tiktok">
        <div class="btn-content">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24">
              <defs>
                <linearGradient id="tt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#25F4EE"/>
                  <stop offset="100%" stop-color="#FE2C55"/>
                </linearGradient>
              </defs>
              <path fill="url(#tt-grad)" d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-1.23h.03V9.21a6.32 6.32 0 1 0 6.32 6.32V8.92a8.3 8.3 0 0 0 5.08 1.72V7.19a4.84 4.84 0 0 1-1.32-.5z"/>
            </svg>
          </div>
          <span class="btn-text" data-text="TikTok">TikTok</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- Dropdown Saluran WhatsApp -->
      <div class="accordion">
        <button class="neu-btn btn-wachannel" onclick="toggleAccordion('channel-dropdown')">
          <div class="btn-content">
            <div class="icon-box">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3C7.03 3 3 7.03 3 12c0 1.8.53 3.47 1.44 4.88L3 21l4.24-1.36A8.93 8.93 0 0 0 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/>

                <path d="M9.2 9.2a4 4 0 0 0 0 5.6"/>
                <path d="M14.8 9.2a4 4 0 0 1 0 5.6"/>
              </svg>
            </div>
            <span class="btn-text" data-text="Saluran WhatsApp">Saluran WhatsApp</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="channel-dropdown" class="accordion-content">
          <a href="https://whatsapp.com/channel/0029VbBZdil3GJOvNRyeDb19" target="_blank" rel="noopener noreferrer" class="sub-btn btn-wachannel">
            <div class="icon-box sub-icon-box">
              <svg class="sub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3C7.03 3 3 7.03 3 12c0 1.8.53 3.47 1.44 4.88L3 21l4.24-1.36A8.93 8.93 0 0 0 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/>
                <circle cx="12" cy="12" r="1" fill="currentColor"/>
                <path d="M9.2 9.2a4 4 0 0 0 0 5.6"/>
                <path d="M14.8 9.2a4 4 0 0 1 0 5.6"/>
              </svg>
            </div>
            <span class="btn-text" data-text="Saluran Admin">Saluran Admin</span>
          </a>
        </div>
      </div>

      <!-- Dropdown WhatsApp Official -->
      <div class="accordion">
        <button class="neu-btn btn-whatsapp" onclick="toggleAccordion('wa-dropdown')">

            <div class="icon-box">

              </svg>
            </div>
            <span class="btn-text" data-text="WhatsApp Official">WhatsApp Official</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="wa-dropdown" class="accordion-content">
          <a href="https://wa.me/6285788074348" target="_blank" rel="noopener noreferrer" class="sub-btn btn-whatsapp">
            <div class="icon-box sub-icon-box">
              <svg class="sub-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.011 0C5.384 0 0 5.383 0 12.011c0 2.116.553 4.187 1.603 6.012L0 24l6.128-1.608a11.97 11.97 0 0 0 5.883 1.528h.005c6.626 0 12.01-5.384 12.01-12.01C24.026 5.383 18.638 0 12.011 0zm0 22.015h-.004a9.98 9.98 0 0 1-5.088-1.396l-.366-.217-3.782.992 1.009-3.687-.238-.379a9.96 9.96 0 0 1-1.531-5.317c0-5.513 4.485-9.998 10.004-9.998 5.518 0 10.003 4.485 10.003 9.998 0 5.514-4.485 10.003-10.003 10.003zm5.485-7.498c-.301-.151-1.782-.88-2.058-.98-.277-.101-.478-.151-.68.151-.201.302-.78 1.006-.956 1.207-.176.201-.352.226-.653.075-.302-.151-1.274-.47-2.427-1.498-.897-.799-1.502-1.788-1.678-2.089-.176-.302-.019-.465.132-.615.136-.135.302-.352.453-.528.151-.176.201-.302.302-.503.101-.201.05-.377-.025-.528-.075-.151-.68-1.636-.931-2.239-.245-.588-.495-.508-.68-.517-.176-.008-.377-.008-.578-.008-.201 0-.528.075-.804.377-.276.302-1.056 1.031-1.056 2.515 0 1.484 1.081 2.917 1.232 3.118.151.201 2.127 3.248 5.153 4.555.72.311 1.282.497 1.721.637.723.23 1.38.197 1.9.12.58-.086 1.782-.729 2.033-1.433.251-.704.251-1.307.176-1.433-.075-.126-.276-.201-.577-.352z"/>
              </svg>
            </div>
            <span class="btn-text" data-text="Whatsapp Admin (0857-8807-4348)">Whatsapp Admin (0857-8807-4348)</span>
          </a>
        </div>
      </div>

      <!-- Dropdown Grup WhatsApp -->
      <div class="accordion">
        <button class="neu-btn btn-wagroup" onclick="toggleAccordion('wagroup-dropdown')">
          <div class="btn-content">
            <div class="icon-box">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor">

              </svg>
            </div>
            <span class="btn-text" data-text="Grup WhatsApp">Grup WhatsApp</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="wagroup-dropdown" class="accordion-content">
          <a href="https://chat.whatsapp.com/I2AsDiHpT0H8eQX7zgRdql" target="_blank" rel="noopener noreferrer" class="sub-btn btn-wagroup">
            <div class="icon-box sub-icon-box">
              <svg class="sub-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
              </svg>
            </div>
            <span class="btn-text" data-text="Grup Info P A P A R A">Grup Info P A P A R A</span>
          </a>
        </div>
      </div>

      <!-- Dropdown QRIS Donasi -->
      <div class="accordion">
        <button class="neu-btn btn-qris" onclick="toggleAccordion('qris-dropdown')">
          <div class="btn-content">
            <div class="icon-box">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm13-2h3v2h-3zm-3 0h2v3h-2zm3 3h3v5h-3zm-3 2h2v3h-2zm-2-2h2v2h-2zm0 3h2v2h-2zm5 0h3v2h-3z"/>
              </svg>
            </div>
            <span class="btn-text" data-text="Donasi / QRIS">Donasi / QRIS</span>
          </div>
          <svg class="arrow-icon toggle-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="qris-dropdown" class="accordion-content">
          <div class="qris-card">
            <div class="qris-img-wrapper">
              <picture>
                <source srcset="qris.webp" type="image/webp">
                <img id="qris-image-src" src="qris.png" alt="QRIS Donasi" class="qris-img" onerror="this.onerror=null; this.src='qris.png';">
              </picture>
            </div>
            <p class="qris-caption">Scan QRIS untuk pembayaran / donasi</p>
            
            <button class="view-qris-btn btn-qris" onclick="openModal()">
              <svg class="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span>Lihat Gambar Jelas</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal Popup QRIS -->
  <div id="qris-modal" class="modal" onclick="closeModal()">
    <div class="modal-wrapper" onclick="event.stopPropagation()">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <img id="modal-img" src="qris.png" alt="QRIS Full View" class="modal-img" onerror="this.onerror=null; this.src='qris.webp';">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
